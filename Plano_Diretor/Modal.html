<!-- MODAL DE ALERTAS GLOBAIS -->
<div x-show="alertModal.show" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl relative space-y-4" @click.away="alertModal.show = false">
    <div class="flex items-center space-x-3">
      <div :class="{
        'text-emerald-600 bg-emerald-100': alertModal.type === 'success',
        'text-blue-600 bg-blue-100': alertModal.type === 'info',
        'text-red-600 bg-red-100': alertModal.type === 'error'
      }" class="p-2 rounded-full">
        <i data-lucide="info" class="w-6 h-6"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800" x-text="alertModal.title"></h3>
    </div>
    <p class="text-sm text-slate-600" x-text="alertModal.message"></p>
    <div class="flex justify-end">
      <button @click="alertModal.show = false" class="px-4 py-2 bg-brand-blue text-white text-sm font-bold rounded-lg hover:bg-brand-darkblue">Entendi</button>
    </div>
  </div>
</div>

<!-- MODAL DE DETALHES DE EVENTO (AGENDA) -->
<div x-show="eventModal.show" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative space-y-4" @click.away="eventModal.show = false">
    <div class="flex justify-between items-start border-b pb-3">
      <div>
        <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800" x-text="eventModal.event?.tipo"></span>
        <h3 class="text-lg font-bold text-slate-900 mt-1" x-text="eventModal.event?.title"></h3>
      </div>
      <button @click="eventModal.show = false" class="text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
  <div class="space-y-3 text-sm text-slate-700">

  <div class="flex items-center space-x-2">
    <i data-lucide="clock" class="w-4 h-4 text-brand-blue"></i>
    <span class="font-medium"
          x-text="eventModal.event ? new Date(eventModal.event.start).toLocaleString('pt-BR') : ''">
    </span>
  </div>

  <div class="flex items-center space-x-2">
    <i data-lucide="map-pin" class="w-4 h-4 text-brand-blue"></i>
    <span class="font-medium"
          x-text="eventModal.event?.location">
    </span>
  </div>

  <p class="p-3 bg-slate-50 rounded-lg border text-xs text-slate-600 leading-relaxed"
     x-text="eventModal.event?.description">
  </p>

  <!-- NOVO BOTÃO -->

  <template x-if="eventModal.event?.eventoUrl">

    <a
      :href="eventModal.event.eventoUrl"
      target="_blank"
      class="flex items-center justify-center gap-2 w-full px-4 py-3 rounded-lg bg-brand-blue hover:bg-blue-700 text-white font-bold text-sm transition-colors">

      <i data-lucide="external-link" class="w-4 h-4"></i>

      <span>Acessar Página Completa do Evento</span>

    </a>

  </template>

</div>

<div class="flex justify-end pt-2">
  <button @click="eventModal.show = false"
          class="px-4 py-2 bg-slate-200 text-slate-800 font-bold text-xs rounded-lg hover:bg-slate-300">
    Fechar
  </button>
</div>
    
  </div>
</div>
