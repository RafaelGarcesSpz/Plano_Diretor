<!-- Dependências Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<!-- MÓDULO DE MAPA INTERATIVO - ZONEAMENTO -->
<div
  x-data="mapaZoneamentoApp()"
  x-init="initApp()"
  class="flex flex-col lg:flex-row h-full w-full min-h-[calc(100vh-5rem)] overflow-hidden bg-slate-50 font-sans relative"
>

  <!-- PAINEL LATERAL -->
  <aside
    :class="isMobileViewport
      ? (sidebarOpen ? 'translate-y-0' : 'translate-y-[calc(100%+1rem)]')
      : (sidebarOpen ? 'translate-x-0' : '-translate-x-full')"
    :style="isMobileViewport ? `height: ${bottomSheetHeight}` : ''"
    class="absolute left-2 top-2 bottom-2 h-auto w-[min(24rem,calc(100vw-1rem))] max-w-[calc(100vw-1rem)] overflow-hidden bg-white border border-slate-200 rounded-xl flex flex-col z-[700] shadow-xl transition-[transform,height] duration-300 ease-in-out max-lg:left-0 max-lg:right-0 max-lg:bottom-0 max-lg:top-auto max-lg:h-auto max-lg:w-full max-lg:max-w-full max-lg:rounded-b-none">
    <!-- Cabeçalho -->

  <div class="p-4 border-b border-slate-100 bg-slate-50/50">
    <!-- A alça funciona como affordance visual e também como área de toque para trocar o estado do painel. -->
    <button
      type="button"
      @pointerdown="startSheetDrag($event)"
      @pointermove="moveSheetDrag($event)"
      @pointerup="endSheetDrag($event)"
      @pointercancel="endSheetDrag($event)"
      @click="cycleBottomSheet()"
      class="mx-auto mb-3 flex h-6 w-16 touch-none items-center justify-center lg:hidden"
      aria-label="Alternar tamanho do painel de zonas">
      <span class="h-1 w-10 rounded-full bg-slate-300" aria-hidden="true"></span>
    </button>
    <div class="flex items-start justify-between">
      <div>

        <div class="flex items-center space-x-2 text-blue-600 mb-1">
          <i data-lucide="map" class="w-5 h-5"></i>
          <h2 class="font-bold text-slate-800 text-lg">
            Zoneamento Urbano
          </h2>
        </div>
        <p class="text-xs text-slate-500">
          Consulte as diretrizes e regras urbanísticas por zona.
        </p>
      </div>

        <button
          @click="sidebarOpen = false"
          class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>
  </div>

    <!-- Resumo contextual: aparece somente após uma zona ser selecionada. -->
    <div x-show="selectedZoneDetails" x-cloak class="mx-4 mt-4 p-3 rounded-lg border border-blue-100 bg-blue-50/70">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="text-[10px] font-semibold uppercase tracking-wider text-blue-600">Zona em destaque</p>
          <p class="text-sm font-bold text-slate-800 truncate" x-text="selectedZoneDetails ? selectedZoneDetails.nome : ''"></p>
        </div>
        <button @click="selectZone(null)" title="Limpar seleção" class="shrink-0 p-1.5 rounded-md text-blue-600 hover:bg-blue-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="mt-1 text-xs text-slate-600" x-text="selectedZoneDetails ? `${selectedZoneDetails.count} feições no território` : ''"></p>
    </div>

    <!-- No estado recolhido, somente título, alça e busca permanecem visíveis. -->
    <div class="p-4 border-b border-slate-100">
      <div class="relative">
        <input 
          type="text" 
          x-model="searchQuery" 
          placeholder="Buscar por sigla ou nome (ex: ZRI, Comércio)..."
          class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg text-sm text-slate-700 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none transition-all"
        />
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <button 
          x-show="searchQuery" 
          @click="searchQuery = ''" 
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Modos de Estilo dos Polígonos -->
    <div x-show="!isMobileViewport || bottomSheetState !== 'collapsed'" x-cloak class="p-4 border-b border-slate-100 bg-slate-50/30">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Estilo das Camadas</label>
      <div class="grid grid-cols-3 gap-1 bg-slate-200/60 p-1 rounded-lg">
        <button 
          @click="setVisMode('contorno')"
          :class="visMode === 'contorno' ? 'bg-white text-slate-900 shadow-sm font-medium' : 'text-slate-600 hover:text-slate-900'"
          class="py-1.5 px-2 text-xs rounded-md transition-all text-center flex flex-col items-center justify-center gap-1"
        >
          <i data-lucide="square" class="w-3.5 h-3.5"></i>
          <span>Contornos</span>
        </button>
        <button 
          @click="setVisMode('transparente')"
          :class="visMode === 'transparente' ? 'bg-white text-slate-900 shadow-sm font-medium' : 'text-slate-600 hover:text-slate-900'"
          class="py-1.5 px-2 text-xs rounded-md transition-all text-center flex flex-col items-center justify-center gap-1"
        >
          <i data-lucide="layers" class="w-3.5 h-3.5"></i>
          <span>Suave</span>
        </button>
        <button 
          @click="setVisMode('colorido')"
          :class="visMode === 'colorido' ? 'bg-white text-slate-900 shadow-sm font-medium' : 'text-slate-600 hover:text-slate-900'"
          class="py-1.5 px-2 text-xs rounded-md transition-all text-center flex flex-col items-center justify-center gap-1"
        >
          <i data-lucide="palette" class="w-3.5 h-3.5"></i>
          <span>Colorido</span>
        </button>
      </div>
    </div>

    <!-- Lista Dinâmica de Zonas -->
    <div x-show="!isMobileViewport || bottomSheetState !== 'collapsed'" x-cloak class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-4 space-y-2 custom-scrollbar">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Filtrar Zonas</span>
        <button 
          x-show="selectedZone !== null" 
          @click="selectZone(null)" 
          class="text-xs text-blue-600 hover:text-blue-800 font-medium"
        >
          Mostrar Todas
        </button>
      </div>

      <template x-if="loading">
        <div class="py-8 text-center text-slate-400 space-y-2">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto text-blue-500"></i>
          <p class="text-xs">Carregando dados do zoneamento...</p>
        </div>
      </template>

      <template x-if="error">
        <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs flex items-start gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
          <span x-text="errorMessage"></span>
        </div>
      </template>

      <template x-for="item in filteredZones" :key="item.sigla">
        <button 
          @click="selectZone(item.sigla)"
          :class="selectedZone === item.sigla ? 'border-blue-500 bg-blue-50/50 shadow-sm ring-1 ring-blue-500' : 'border-slate-200 hover:border-slate-300 bg-white'"
          class="w-full text-left p-3 rounded-lg border transition-all flex items-start justify-between group"
        >
          <div class="flex items-start space-x-3">
            <span 
              class="w-3.5 h-3.5 rounded-full shrink-0 mt-0.5 border"
              :style="`background-color: ${item.cor_fill}; border-color: ${item.cor_stroke}`"
            ></span>
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="font-bold text-slate-800 text-xs" x-text="item.sigla"></span>
                <span class="text-slate-400 text-xs">•</span>
                <span class="text-slate-600 text-xs font-medium" x-text="item.nome"></span>
              </div>
              <p class="text-xs text-slate-500 line-clamp-1 mt-0.5" x-text="item.descricao"></p>
            </div>
          </div>
          <span 
            class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 group-hover:bg-slate-200 shrink-0"
            x-text="item.count"
          ></span>
        </button>
      </template>
    </div>

    <div x-show="!isMobileViewport || bottomSheetState === 'expanded'" x-cloak class="p-3 border-t border-slate-200 bg-slate-50 text-xs text-slate-500 flex justify-between items-center">
      <span>Total de Feições: <strong class="text-slate-700" x-text="totalFeatures">0</strong></span>
      <span>Zonas Ativas: <strong class="text-slate-700" x-text="availableZones.length">0</strong></span>
    </div>
  </aside>

  <!-- MAPA LEAFLET -->
  <main class="flex-1 relative w-full h-full min-h-[calc(100vh-5rem)] bg-slate-100 overflow-hidden">

    <div
      x-show="!sidebarOpen"
      x-transition
      class="absolute top-4 left-3 z-[800] max-w-[calc(100vw-1.5rem)]">

      <button
        @click="sidebarOpen = true"
        class="bg-white shadow-lg border border-slate-200 rounded-lg px-3 py-2 flex items-center gap-2 hover:bg-slate-50">

        <i data-lucide="panel-left" class="w-4 h-4"></i>

        <span class="text-sm font-medium">
          Zoneamento
        </span>
       </button>
    </div>

    <!-- Legenda compacta: mantém o significado das cores visível sem competir com o mapa. -->
    <div x-show="legendOpen" x-transition class="absolute bottom-8 left-3 z-[500] w-44 max-w-[calc(100vw-1.5rem)] rounded-lg border border-slate-200 bg-white/95 p-3 shadow-lg backdrop-blur">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-slate-800">Legenda</span>
        <button @click="legendOpen = false" title="Ocultar legenda" class="p-1 text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <div class="mb-2 flex items-center gap-2 text-[11px] text-slate-600">
        <span class="h-0 w-4 shrink-0 border-t-2 border-dashed border-teal-700"></span>
        <span>Limite urbano</span>
      </div>
      <div class="space-y-1.5 max-h-36 overflow-y-auto">
        <template x-for="item in availableZones" :key="`legend-${item.sigla}`">
          <button @click="selectZone(item.sigla)" class="flex w-full items-center gap-2 text-left text-[11px] text-slate-600 hover:text-slate-900">
            <span class="h-3 w-3 shrink-0 rounded-sm border" :style="`background-color: ${item.cor_fill}; border-color: ${item.cor_stroke}`"></span>
            <span class="truncate" x-text="`${item.sigla} - ${item.nome}`"></span>
          </button>
        </template>
      </div>
    </div>

    <button x-show="!legendOpen && availableZones.length" @click="legendOpen = true" title="Mostrar legenda" class="absolute bottom-8 left-3 z-[500] rounded-lg border border-slate-200 bg-white/95 p-2 text-slate-700 shadow-lg hover:bg-white">
      <i data-lucide="list" class="w-4 h-4"></i>
    </button>

    <div id="leaflet-map" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- Seletor de Mapa Base (OpenStreetMap vs Satélite) -->
  <div
  class="absolute top-4 left-1/2 z-[500] flex max-w-[calc(100vw-10rem)] -translate-x-1/2 gap-1 overflow-hidden rounded-lg border border-slate-200 bg-white/90 p-1 shadow-md backdrop-blur">
      <button 
        @click="setBaseLayer('street')" 
        :class="baseLayer === 'street' ? 'bg-blue-600 text-white font-medium' : 'text-slate-700 hover:bg-slate-100'"
        class="px-2.5 py-1 text-xs rounded-md transition-all flex items-center gap-1"
      >
        <i data-lucide="map" class="w-3.5 h-3.5"></i>
        <span>Mapa</span>
      </button>
      <button 
        @click="setBaseLayer('satellite')" 
        :class="baseLayer === 'satellite' ? 'bg-blue-600 text-white font-medium' : 'text-slate-700 hover:bg-slate-100'"
        class="px-2.5 py-1 text-xs rounded-md transition-all flex items-center gap-1"
      >
        <i data-lucide="globe" class="w-3.5 h-3.5"></i>
        <span>Satélite</span>
      </button>
    </div>

    <!-- Botão de Centralizar -->
    <div class="absolute right-3 top-16 z-[500] flex max-w-[calc(100vw-1.5rem)] gap-1 rounded-lg border border-slate-200 bg-white/90 p-1.5 shadow-md backdrop-blur sm:top-4">
          <button
        @click="resetView()"
        title="Voltar para Sapezal"
        class="px-3 py-2 text-slate-700 hover:bg-slate-100 rounded-md transition-all flex items-center gap-2">

        <i data-lucide="locate-fixed" class="w-4 h-4"></i>

        <span class="text-xs font-medium">
          Centralizar
        </span>
      </button>
    </div>
  </main>
</div>

<script>
function mapaZoneamentoApp() {
  return {

    teste: 'OK',
    driveFileId: '1oud92GigcCUYgD09eFMes2i6NeL_tWHy',

    //driveFileIdPerimetro:'16WVP93hwyCYZJfnvJyipLd8pFrbEqJT0',
    
    loading: true,
    error: false,
    errorMessage: '',
    searchQuery: '',
    selectedZone: null,
    visMode: 'colorido',
    baseLayer: 'street', // 'street' ou 'satellite'
    // No celular o painel começa recolhido, mas visível como uma faixa inferior para preservar a descoberta da interação.
    sidebarOpen: true,
    legendOpen: true,
      isMobileViewport: window.innerWidth < 1024,
      bottomSheetState: 'collapsed',
      sheetDrag: { active: false, startY: 0, startHeight: 0, moved: false },
    
    geoJsonRaw: null,
    availableZones: [],
    totalFeatures: 0,

    //perimetroLayer: null,
    //perimetroBounds: null,
    map: null,
    geoJsonLayer: null,
    perimetroLayer: null,
    tileLayers: {},
    

    // Coordenadas Centrais de Sapezal - MT
    sapezalCenter: [-13.5432, -58.8123],
    fallbackBounds: [[-13.64, -58.94], [-13.44, -58.68]],

    zoneConfig: {
      'ZRI':   { order: 1, nome: 'Zona Residencial I' },
      'ZRII':  { order: 2, nome: 'Zona Residencial II' },
      'ZRIII': { order: 3, nome: 'Zona Residencial III' },
      'ZM':    { order: 4, nome: 'Zona Mista' },
      'ZCS':   { order: 5, nome: 'Zona de Comércio e Serviços' },
      'ZEIS':  { order: 6, nome: 'Zona de Interesse Social' },
      'ZEPP':  { order: 7, nome: 'Zona Especial de Preservação Permanente' },
      'ZI':    { order: 8, nome: 'Zona Industrial' },
      'ZE':    { order: 9, nome: 'Zona Empresarial' }
    },

    initApp() {
      this.$nextTick(() => {
          // A altura do painel é recalculada somente para a experiência mobile; no desktop a sidebar usa o espaço do mapa.
          this.isMobileViewport = window.innerWidth < 1024;
        this.initMap();
        this.fetchGeoJson();
        this.fetchPerimetro();

        const mapEl = document.getElementById('leaflet-map');
        if (mapEl && typeof ResizeObserver !== 'undefined') {
          new ResizeObserver(() => {
            if (this.map) this.map.invalidateSize();
          }).observe(mapEl);
        }
      });
    },

    get bottomSheetHeight() {
      if (!this.isMobileViewport) return '';
      if (this.sheetDrag.height) return `${this.sheetDrag.height}px`;

      const viewportHeight = window.innerHeight || 700;
      const heights = {
        collapsed: Math.max(148, Math.min(190, viewportHeight * 0.22)),
        half: Math.min(430, viewportHeight * 0.52),
        expanded: Math.max(0, viewportHeight - 16)
      };
      return `${Math.round(heights[this.bottomSheetState])}px`;
    },

    cycleBottomSheet() {
      // O toque na alça alterna entre os três níveis sem exigir gesto preciso em telas pequenas.
      if (!this.isMobileViewport || this.sheetDrag.suppressClick) return;
      const states = ['collapsed', 'half', 'expanded'];
      const nextIndex = (states.indexOf(this.bottomSheetState) + 1) % states.length;
      this.bottomSheetState = states[nextIndex];
      this.sheetDrag.height = null;
    },

    startSheetDrag(event) {
      if (!this.isMobileViewport) return;
      this.sheetDrag = {
        active: true,
        startY: event.clientY,
        startHeight: parseFloat(this.bottomSheetHeight),
        height: null,
        moved: false,
        suppressClick: false
      };
      event.currentTarget.setPointerCapture?.(event.pointerId);
    },

    moveSheetDrag(event) {
      if (!this.sheetDrag.active) return;
      const viewportHeight = window.innerHeight || 700;
      const delta = this.sheetDrag.startY - event.clientY;
      if (Math.abs(delta) < 4) return;

      // Arrastar para cima aumenta a área de leitura; arrastar para baixo devolve espaço ao mapa.
      this.sheetDrag.moved = true;
      this.sheetDrag.height = Math.round(Math.max(148, Math.min(viewportHeight - 16, this.sheetDrag.startHeight + delta)));
    },

    endSheetDrag(event) {
      if (!this.sheetDrag.active) return;
      event.currentTarget.releasePointerCapture?.(event.pointerId);

      if (this.sheetDrag.moved) {
        const viewportHeight = window.innerHeight || 700;
        const height = this.sheetDrag.height;
        this.bottomSheetState = height > viewportHeight * 0.72 ? 'expanded' : height > viewportHeight * 0.35 ? 'half' : 'collapsed';
        this.sheetDrag.suppressClick = true;
        this.sheetDrag.height = null;
        window.setTimeout(() => { this.sheetDrag.suppressClick = false; }, 0);
      }
      this.sheetDrag.active = false;
    },

    initMap() {
      if (this.map) return;

      this.map = L.map('leaflet-map', {
        zoomControl: false,
        minZoom: 13,
        maxZoom: 19,
        closePopupOnClick: true,
        // Evita que popups removidos durante a troca de camadas recebam eventos de zoom atrasados.
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,
        maxBounds: this.fallbackBounds,
        maxBoundsViscosity: 1
      }).setView(this.sapezalCenter, 14);

      L.control.zoom({ position: 'bottomright' }).addTo(this.map);

      // Camada 1: OpenStreetMap (Vetor)
      this.tileLayers.street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap | Prefeitura Municipal de Sapezal'
      });

      // Camada 2: Esri World Imagery (Satélite)
      this.tileLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      });

      this.tileLayers.street.addTo(this.map);

      setTimeout(() => { if (this.map) this.map.invalidateSize(); }, 300);
    },

    setBaseLayer(layerType) {
      if (this.baseLayer === layerType) return;
      
      this.map.removeLayer(this.tileLayers[this.baseLayer]);
      this.tileLayers[layerType].addTo(this.map);
      this.baseLayer = layerType;
    },

  fetchGeoJson() {
      this.loading = true;
      this.error = false;
      
      google.script.run
        .withSuccessHandler((response) => {
          if (response && response.success) {
            this.geoJsonRaw = response.data;
            this.processGeoJson();
          } else {
            this.error = true;
            this.errorMessage = response ? response.error : 'Erro ao ler dados do backend.';
          }
          this.loading = false;
          
          this.$nextTick(() => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            if (this.map) this.map.invalidateSize();
          });
        })
        .withFailureHandler((err) => {
          this.loading = false;
          this.error = true;
          this.errorMessage = err.message || 'Falha de comunicação com o servidor.';
        })
        .getGeoJsonData(this.driveFileId);
    },
      
    fetchPerimetro() {
      // O perímetro é uma referência visual; se o arquivo falhar, o zoneamento continua disponível.
      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.success || !response.data) return;

          this.perimetroLayer = L.geoJSON(response.data, {
            style: {
              color: '#0f766e',
              weight: 2.5,
              dashArray: '7 5',
              fillColor: '#14b8a6',
              fillOpacity: 0.06,
              interactive: false
            }
          }).addTo(this.map);

          // O limite fica atrás das zonas e funciona como contexto, não como máscara visual.
          this.perimetroLayer.bringToBack();
        })
        .withFailureHandler(() => {
          // A camada complementar não deve bloquear o carregamento do mapa principal.
        })
        // O sufixo garante que o backend procure o arquivo pelo nome, não como ID.
        .getGeoJsonData('Perimetro_urbano_vigente_v2.geojson');
    },
    processGeoJson() {
      if (!this.geoJsonRaw || !this.geoJsonRaw.features) return;

      this.totalFeatures = this.geoJsonRaw.features.length;
      const zoneMap = {};

      this.geoJsonRaw.features.forEach(f => {
        const props = f.properties || {};
        const sigla = (props.zona || 'OUTROS').toUpperCase();
        
        if (!zoneMap[sigla]) {
          const config = this.zoneConfig[sigla] || { order: 99, nome: sigla };
          zoneMap[sigla] = {
            sigla: sigla,
            nome: config.nome,
            order: config.order,
            descricao: props.descricao || 'Sem descrição cadastrada.',
            cor_fill: props.cor_fill || '#3b82f6',
            cor_stroke: props.cor_stroke || '#1d4ed8',
            count: 0
          };
        }
        zoneMap[sigla].count++;
      });

      this.availableZones = Object.values(zoneMap).sort((a, b) => a.order - b.order);
      this.configureMapBounds();
      this.renderMapLayer();
    },

    configureMapBounds() {
      const dataLayer = L.geoJSON(this.geoJsonRaw);
      const bounds = dataLayer.getBounds();
      const center = bounds.isValid() ? bounds.getCenter() : null;
      const nearSapezal = center && Math.abs(center.lat - this.sapezalCenter[0]) < 2 &&
        Math.abs(center.lng - this.sapezalCenter[1]) < 2;
      const compactEnough = bounds.isValid() &&
        bounds.getNorth() - bounds.getSouth() < 1.5 &&
        bounds.getEast() - bounds.getWest() < 1.5;
      const safeBounds = nearSapezal && compactEnough ? bounds : L.latLngBounds(this.fallbackBounds);

      this.map.setMaxBounds(safeBounds.pad(0.25));
      const zoom = this.map.getBoundsZoom(safeBounds, false);
      this.map.setMinZoom(Math.min(Math.max(zoom, 13), 16));
      this.map.fitBounds(safeBounds, { padding: [24, 24], maxZoom: 16 });
    },

    get filteredZones() {
      if (!this.searchQuery) return this.availableZones;
      const q = this.searchQuery.toLowerCase();
      return this.availableZones.filter(z => 
        z.sigla.toLowerCase().includes(q) || 
        z.nome.toLowerCase().includes(q)
      );
    },

    get selectedZoneDetails() {
      return this.availableZones.find((zone) => zone.sigla === this.selectedZone) || null;
    },

    getStyle(feature) {
      const props = feature.properties || {};
      const fill = props.cor_fill || '#3b82f6';
      const stroke = props.cor_stroke || '#1d4ed8';
      const isSelected = this.selectedZone &&
        (props.zona || '').toUpperCase() === this.selectedZone;

      // Mantém o contexto territorial: a zona escolhida ganha contraste e as demais recuam visualmente.
      if (this.selectedZone && !isSelected) {
        return { fillColor: '#cbd5e1', fillOpacity: 0.04, color: '#94a3b8', weight: 1 };
      }

      if (this.visMode === 'colorido') {
        return { fillColor: fill, fillOpacity: isSelected ? 0.58 : 0.35, color: stroke, weight: isSelected ? 3 : 2 };
      } else if (this.visMode === 'transparente') {
        return { fillColor: fill, fillOpacity: isSelected ? 0.35 : 0.12, color: stroke, weight: isSelected ? 3 : 2 };
      } else { 
        return { fillColor: 'transparent', fillOpacity: 0, color: stroke, weight: isSelected ? 4 : 2.5 };
      }
    },

    renderMapLayer() {
      if (!this.geoJsonRaw || !this.map) return;

      if (this.geoJsonLayer) {
        // Interrompe qualquer transição antes de remover a camada que pode ser a origem de um popup aberto.
        this.map.stop();
        this.map.closePopup();
        this.geoJsonLayer.eachLayer((layer) => {
          if (layer.isPopupOpen && layer.isPopupOpen()) layer.closePopup();
        });
        this.geoJsonLayer.remove();
        this.geoJsonLayer = null;
      }

      this.geoJsonLayer = L.geoJSON(this.geoJsonRaw, {
        // Todas as zonas permanecem visíveis; a seleção é comunicada por contraste e enquadramento.
        filter: () => true,
        style: (feature) => this.getStyle(feature),
        onEachFeature: (feature, layer) => {
          const props = feature.properties || {};
          const sigla = (props.zona || '').toUpperCase();
          const config = this.zoneConfig[sigla] || {};
          const nome = config.nome || sigla;

          layer.bindPopup(`
            <div class="font-sans p-1 max-w-xs">
              <div class="flex items-center space-x-1.5 mb-1">
                <span class="font-bold text-slate-800 text-sm">${sigla}</span>
                <span class="text-slate-400">•</span>
                <span class="text-xs text-slate-600 font-medium">${nome}</span>
              </div>
              <p class="text-xs text-slate-600 mb-2 leading-relaxed">${props.descricao || 'Sem descrição cadastrada.'}</p>
            </div>
          `);
        }
      }).addTo(this.map);

      const selectedLayer = this.selectedZone ? L.geoJSON(this.geoJsonRaw, {
        filter: (feature) => (feature.properties.zona || '').toUpperCase() === this.selectedZone
      }) : null;
      const selectedBounds = selectedLayer ? selectedLayer.getBounds() : null;

      if (selectedBounds && selectedBounds.isValid()) {
        this.map.fitBounds(selectedBounds, {
          padding: [48, 48],
          maxZoom: 17,
          animate: false
        });
      }
    },

    setVisMode(mode) {
      this.visMode = mode;
      if (!this.geoJsonLayer) return;
      this.geoJsonLayer.setStyle((feature) => this.getStyle(feature));
    },

    selectZone(sigla) {
      this.selectedZone = sigla;
      this.renderMapLayer();
    },

    resetView() {
      this.selectedZone = null;
      this.renderMapLayer();
      this.map.setView(this.sapezalCenter, 14);
    }
  };
}
</script>
