<section x-data="{ busca: '' }" class="space-y-6">
  <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
    <h2 class="text-xl font-bold text-slate-900">Memória e Plano Diretor Anterior</h2>
    <p class="text-sm text-slate-600" x-text="db.planoAnterior.resumo"></p>
    
    <!-- Input de Pesquisa por Palavra-Chave -->
    <div class="mt-4 relative">
      <input type="text" x-model="busca" placeholder="Pesquisar leis, mapas ou relatórios do plano anterior..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-brand-blue focus:outline-none">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
    </div>
  </div>

  <!-- Lista de Documentos Historicos -->
  <div class="bg-white rounded-lg border border-slate-200 shadow-sm divide-y divide-slate-200">
    <template x-for="doc in db.planoAnterior.documentos.filter(d => d.titulo.toLowerCase().includes(busca.toLowerCase()))" :key="doc.titulo">
      <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-red-50 text-red-600 rounded">
            <i data-lucide="file-text" class="w-6 h-6"></i>
          </div>
          <div>
            <h4 class="text-sm font-bold text-slate-800" x-text="doc.titulo"></h4>
            <span class="text-xs text-slate-500" x-text="doc.tipo + ' • ' + doc.tamanho"></span>
          </div>
        </div>
        <a :href="doc.url" download class="px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-brand-blue hover:text-white rounded text-xs font-semibold flex items-center space-x-1 transition-colors">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Baixar</span>
        </a>
      </div>
    </template>
  </div>
</section>
