<section x-data="{ modoVisao: 'lista', filtroStatus: 'todos' }" class="space-y-6">
  
  <!-- Cabeçalho e Seletor de Modo de Visualização -->
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h2 class="text-xl font-bold text-slate-900">Agenda e Eventos Oficiais</h2>
      <p class="text-sm text-slate-600">Acompanhe audiências, oficinas e reuniões presenciais e digitais.</p>
    </div>

    <!-- Seletor Lista / Calendário -->
    <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200 self-start md:self-auto">
      <button @click="modoVisao = 'lista'"
              :class="modoVisao === 'lista' ? 'bg-white text-brand-blue shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'"
              class="px-3.5 py-1.5 rounded-md text-xs transition-all flex items-center space-x-1.5">
        <i data-lucide="list" class="w-4 h-4"></i>
        <span>Lista</span>
      </button>
      <button @click="modoVisao = 'calendario'; $nextTick(() => initFullCalendar())"
              :class="modoVisao === 'calendario' ? 'bg-white text-brand-blue shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'"
              class="px-3.5 py-1.5 rounded-md text-xs transition-all flex items-center space-x-1.5">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span>Calendário</span>
      </button>
    </div>
  </div>

  <!-- VISUALIZAÇÃO EM LISTA -->
  <div x-show="modoVisao === 'lista'" class="space-y-4">
    <!-- Filtros de Status -->
    <div class="flex flex-wrap gap-2">
      <button @click="filtroStatus = 'todos'" :class="filtroStatus === 'todos' ? 'bg-brand-blue text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 rounded-full text-xs font-semibold">Todos</button>
      <button @click="filtroStatus = 'Agendado'" :class="filtroStatus === 'Agendado' ? 'bg-blue-600 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 rounded-full text-xs font-semibold">Agendados</button>
      <button @click="filtroStatus = 'Em andamento'" :class="filtroStatus === 'Em andamento' ? 'bg-amber-500 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 rounded-full text-xs font-semibold">Em Andamento</button>
      <button @click="filtroStatus = 'Realizado'" :class="filtroStatus === 'Realizado' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'" class="px-3 py-1.5 rounded-full text-xs font-semibold">Realizados</button>
    </div>

    <!-- Grid de Cards de Eventos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <template x-for="evt in db.eventos.filter(e => filtroStatus === 'todos' || e.status === filtroStatus)" :key="evt.id">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-4 hover:shadow-md transition-shadow">
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full"
                    :class="{
                      'bg-emerald-100 text-emerald-800': evt.status === 'Realizado',
                      'bg-amber-100 text-amber-800': evt.status === 'Em andamento',
                      'bg-blue-100 text-blue-800': evt.status === 'Agendado'
                    }" x-text="evt.status"></span>
              <span class="text-xs text-slate-400 font-medium" x-text="evt.tipo"></span>
            </div>

            <h3 class="text-base font-bold text-slate-800" x-text="evt.title"></h3>
            
            <div class="text-xs text-slate-600 space-y-1">
              <div class="flex items-center space-x-2">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                <span x-text="new Date(evt.start).toLocaleString('pt-BR')"></span>
              </div>
              <div class="flex items-center space-x-2">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i>
                <span x-text="evt.location"></span>
              </div>
            </div>
            
            <p class="text-xs text-slate-500 line-clamp-2 pt-1" x-text="evt.description"></p>
            
          </div>

          <button @click="eventModal = { show: true, event: evt }" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold rounded-lg transition-colors flex items-center justify-center space-x-1">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span>Ver Detalhes do Evento</span>
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- VISUALIZAÇÃO CALENDÁRIO (FULLCALENDAR) -->
  <div x-show="modoVisao === 'calendario'" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
    <div id="fullcalendar-container"></div>
  </div>
</section>
