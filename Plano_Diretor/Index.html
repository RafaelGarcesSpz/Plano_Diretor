<body class="h-full w-full overflow-y-auto flex flex-col font-sans text-slate-800 bg-white antialiased selection:bg-brand-blue selection:text-white" x-data="appState()" x-init="initApp()">

  <!-- Skip Link Acessibilidade -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:p-4 focus:bg-brand-yellow focus:text-brand-blue-dark font-bold">
    Ir para o conteúdo principal
  </a>

  <!-- Header Institucional & Navbar -->
  <?!= include('Header'); ?>

  <!-- Conteúdo Principal -->
  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 focus:outline-none" tabindex="-1">
    
    <!-- State: Skeleton Loading Institucional -->
    <div x-show="loading" class="space-y-6 animate-pulse" aria-hidden="true">
      <div class="h-32 bg-slate-100 rounded-lg"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="h-40 bg-slate-100 rounded-lg"></div>
        <div class="h-40 bg-slate-100 rounded-lg"></div>
        <div class="h-40 bg-slate-100 rounded-lg"></div>
      </div>
    </div>

    <!-- State: Error Institucional -->
    <div x-show="error" x-cloak class="p-6 bg-red-50 border border-red-200 border-l-4 border-l-red-500 text-red-700 rounded-r-md shadow-xs">
      <div class="flex items-center space-x-3">
        <i data-lucide="alert-triangle" class="w-6 h-6 text-red-500"></i>
        <h2 class="text-lg font-bold">Erro ao carregar os dados</h2>
      </div>
      <p class="mt-2 text-sm" x-text="errorMessage"></p>
      <button @click="loadData()" class="mt-4 px-4 py-2 bg-red-600 text-white font-medium text-sm rounded-md hover:bg-red-700 transition-colors">
        Tentar Novamente
      </button>
    </div>

    <!-- Rotas Dinâmicas SPA -->
    <div x-show="!loading && !error" x-cloak class="w-full h-full">
      <div x-show="currentTab === 'inicio'" x-transition.opacity.duration.300ms>
        <?!= include('PageHome'); ?>
      </div>
      
      <div x-show="currentTab === 'calendario'" x-transition.opacity.duration.300ms>
        <?!= include('PageCalendario'); ?>
      </div>
      
      <!-- O mapa compensa o padding lateral do main para ocupar toda a viewport sem faixa branca no mobile. -->
      <div 
        x-show="currentTab === 'mapas'" 
        x-transition.opacity.duration.300ms
        class="w-[calc(100%+2rem)] sm:w-[calc(100%+3rem)] lg:w-[calc(100%+4rem)] -mx-4 sm:-mx-6 lg:-mx-8 -my-6"
      >
        <?!= include('PageMapas'); ?>
      </div>

      <div x-show="currentTab === 'participacao'" x-transition.opacity.duration.300ms>
        <?!= include('PageParticipacao'); ?>
      </div>
      
      <div x-show="currentTab === 'videos'" x-transition.opacity.duration.300ms>
        <?!= include('PageVideos'); ?>
      </div>
      
      <div x-show="currentTab === 'plano-anterior'" x-transition.opacity.duration.300ms>
        <?!= include('PageAnterior'); ?>
      </div>
      
      <div x-show="currentTab === 'faq'" x-transition.opacity.duration.300ms>
        <?!= include('PageFAQ'); ?>
      </div>
    </div>

  </main>

  <!-- Rodapé Institucional -->
  <?!= include('Footer'); ?>
