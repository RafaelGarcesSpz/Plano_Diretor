  <!-- Tailwind CSS via CDN com tokens da Marca Oficial -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              'green-dark': 'var(--brand-green-dark)',
              'green': 'var(--brand-green)',
              'green-light': 'var(--brand-green-light)',
              'yellow': 'var(--brand-yellow)',
              'yellow-dark': 'var(--brand-yellow-dark)',
              'gold': 'var(--brand-gold)',
              'blue-light': 'var(--brand-blue-light)',
              'blue': 'var(--brand-blue)',
              'blue-dark': 'var(--brand-blue-dark)',
            }
          }
        }
      }
    }
  </script>

  <!-- CSS Variables Centralizadas -->
  <style>
    :root {
      --brand-green-dark: #0f560f;
      --brand-green: #409240;
      --brand-green-light: #839f21;
      --brand-yellow: #ffd200;
      --brand-yellow-dark: #e2bd1e;
      --brand-gold: #cea20a;
      --brand-blue-light: #0385d0;
      --brand-blue: #015797;
      --brand-blue-dark: #072b4c;
    }

    [x-cloak] { 
      display: none !important; 
    }

    /* Estilização para botões e componentes institucionais */
    .btn-brand-primary {
      background-color: var(--brand-blue);
      color: #ffffff;
      transition: background-color 0.2s ease;
    }
    .btn-brand-primary:hover {
      background-color: var(--brand-blue-dark);
    }

    .btn-brand-secondary {
      background-color: var(--brand-green);
      color: #ffffff;
      transition: background-color 0.2s ease;
    }
    .btn-brand-secondary:hover {
      background-color: var(--brand-green-dark);
    }

    .btn-brand-highlight {
      background-color: var(--brand-yellow);
      color: var(--brand-blue-dark);
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .btn-brand-highlight:hover {
      background-color: var(--brand-gold);
      color: #ffffff;
    }

    .bg-brand-gradient {
      background: linear-gradient(135deg, var(--brand-blue-dark) 0%, var(--brand-blue) 100%);
    }

    .bg-brand-gradient-green {
      background: linear-gradient(135deg, var(--brand-green-dark) 0%, var(--brand-green) 100%);
    }
  </style>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

        <div class="h-40 bg-slate-100 rounded-lg"></div>

      </div>

    </div>
